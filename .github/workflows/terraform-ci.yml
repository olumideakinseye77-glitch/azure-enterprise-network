name: Terraform CI

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: 2fe86e1c-4488-448e-bc02-9fcfdaa714fe
          tenant-id: f7a4a0bf-cedb-46e1-aeae-d875e38e3dbf
          subscription-id: 0be06fbd-8a1c-4544-8855-fcea8dfd8a76

      - name: Verify Azure identity
        run: az account show --output table
